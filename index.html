<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearTax</title>
<meta name="description" content="ClearTax — tools and services.">
<link rel="preload" href="/fonts/archivo-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
--ink:#16202a; --ink2:#41525f; --ink3:#6d7f8c;
--paper:#e7ecf0; --panel:#ffffff;
--rule:#c6d1d9; --rule2:#dfe7ec;
--accent:#2c3e8f;
--sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
--r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
background:var(--paper); color:var(--ink); font-family:var(--sans);
font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
min-height:100vh; display:flex; flex-direction:column;
}
a{color:var(--accent)}
main{max-width:640px;margin:0 auto;padding:0 24px;flex:1;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:13px;height:13px;border:2px solid var(--ink);border-radius:50%;position:relative;flex:0 0 auto}
.mark::after{content:"";position:absolute;left:50%;top:-9px;width:2px;height:8px;background:var(--ink)}
h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.012em}
.tagline{margin:8px 0 0 23px;color:var(--ink2);font-size:14px}
.tools{list-style:none;margin:34px 0 0;padding:0;border-top:1px solid var(--rule)}
.tools li{border-bottom:1px solid var(--rule2)}
.tools a{
display:flex;align-items:baseline;gap:12px;padding:16px 4px;
text-decoration:none;color:inherit;
}
.tools a:hover{background:var(--panel)}
.tools a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tools b{font-weight:600;font-size:15px;flex:0 0 auto}
.tools span{color:var(--ink3);font-size:13.5px}
.tools .go{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--accent);flex:0 0 auto}
footer{max-width:640px;margin:0 auto;padding:24px;color:var(--ink3);font-size:12.5px;width:100%}
@media (max-width:520px){
.tools a{flex-wrap:wrap;gap:4px 12px}
.tools .go{margin-left:0;width:100%}
}
</style>
</head>
<body>

<main>
<div class="brand"><span class="mark" aria-hidden="true"></span><h1>ClearTax</h1></div>
<p class="tagline">Internal tools.</p>

<ul class="tools">
<li>
<a href="/webtesting">
<b>Site audit</b>
<span>Crawl a site and list what to fix</span>
<span class="go">/webtesting &rarr;</span>
</a>
</li>
</ul>
</main>

<footer>
<p>Placeholder home page. Replace this with the real one — the audit tool at <a href="/webtesting">/webtesting</a> is independent of it.</p>
</footer>

</body>
</html>
